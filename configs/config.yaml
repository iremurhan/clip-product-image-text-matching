data:
  product_image_dir: "trendyol_dataset/product_images"
  review_image_dir: "trendyol_dataset/review_images"
  dataset_file: "trendyol_dataset/updated_trendyol_dataset_with_images.csv"
  aligned_pairs: "trendyol_dataset/aligned_pairs.json"
  misaligned_pairs: "trendyol_dataset/misaligned_pairs.json"
  train_pairs: "trendyol_dataset/train_pairs.json"
  test_pairs: "trendyol_dataset/test_pairs.json"

model:
  pretrained_model: "openai/clip-vit-base-patch32"
  batch_size: 32
  learning_rate: 1e-5
  epochs: 3
  save_every_n_steps: 100

evaluation:
  threshold: 0.4